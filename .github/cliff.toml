[remote.github]
owner = "AnomalyNTE"
repo = "Anomaly"

[changelog]
header = """
# 更新日志
"""

body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} \
        {% if commit.remote.username %} @{{ commit.remote.username }}{% else %} {{ commit.author.name }}{% endif %}
        {%- if commit.footers -%}
            {%- for footer in commit.footers -%}
                {%- if footer.token == "Co-authored-by" -%}
                    {%- set co_author_name = footer.value | split(pat=" <") | first | trim %} @{{ co_author_name }}
                {%- endif -%}
            {%- endfor -%}
        {%- endif %}
{% endmacro -%}

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## 未发布
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## 新贡献者
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{% endfor %}
{% endif %}
"""

footer = """
## 国内下载源

- [夸克网盘](https://pan.quark.cn/s/81a25f50de52?pwd=gGdV) 提取码: gGdV
- [百度网盘](https://pan.baidu.com/s/1x5PpiYT8GM2z0_axmcAJ9w?pwd=hfs5) 提取码: hfs5
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
commit_parsers = [
    { message = ".*\\[skip changelog\\].*", skip = true },
    { body = ".*\\[skip changelog\\].*", skip = true },
    { message = "^feat", group = "<!-- 0 -->新功能" },
    { message = "^fix", group = "<!-- 1 -->Bug 修复" },
    { message = "^refactor", group = "<!-- 2 -->代码重构" },
    { message = "^perf", group = "<!-- 3 -->性能优化" },
    { message = "^docs", group = "<!-- 4 -->文档" },
    { message = "^style", group = "<!-- 5 -->样式" },
    { message = "^test", group = "<!-- 6 -->测试" },
    { message = "^ci", group = "<!-- 7 -->持续集成" },
    { message = "^chore\\(deps\\)", group = "<!-- 8 -->依赖更新" },
    { message = "^chore", group = "<!-- 9 -->日常维护" },
    { body = ".*security", group = "<!-- 10 -->安全" },
    { message = "^revert", group = "<!-- 11 -->撤销" },
]
ignore_tags = "rc"
sort_commits = "oldest"

[git.github]
commits = true
