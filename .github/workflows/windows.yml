name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      fixtures:
        description: Also build the development fixtures and test plugin packages
        type: boolean
        default: false
      announce:
        description: Send the latest release notes to Discord as a webhook test (creates no release)
        type: boolean
        default: false

jobs:
  build:
    # Run workflow with announce=true is a Discord-only test and builds nothing.
    if: github.event_name != 'workflow_dispatch' || inputs.announce != true
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        env:
          # Fixtures and test plugin packages are opt-in; a normal run
          # builds only the Runtime, Tools and SDK targets.
          ANOMALY_BUILD_OPTIONAL: ${{ inputs.fixtures == true && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            "-DANOMALY_BUILD_TEST_FIXTURES=$env:ANOMALY_BUILD_OPTIONAL",
            "-DANOMALY_BUILD_TEST_PLUGINS=$env:ANOMALY_BUILD_OPTIONAL"
          )
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          }
          cmake @arguments
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Stage CI runtime and tools
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component GameRuntime
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/tools --component Tools
      - name: Stage CI test plugins
        if: github.ref_type != 'tag' && inputs.fixtures == true
        shell: pwsh
        run: |
          cmake --install .build/windows-vs2022 --config RelWithDebInfo --prefix .build/ci-artifacts/runtime --component TestPlugins
      - name: Upload CI runtime
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-runtime-windows-x64
          path: .build/ci-artifacts/runtime
          if-no-files-found: error
      - name: Upload CI tools
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-tools-windows-x64
          path: .build/ci-artifacts/tools
          if-no-files-found: error
      - name: Package runtime, tools and SDK
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        id: notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
          "body<<ANOMALY_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content CHANGES.md -Raw | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ANOMALY_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
      - name: Announce release on Discord
        uses: SethCohen/github-releases-to-discord@v1.20
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: Anomaly ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          color: '11052455'
          username: Anomaly
          avatar_url: https://raw.githubusercontent.com/AnomalyNTE/Anomaly/main/logo.png
          footer_title: Anomaly
          footer_icon_url: https://raw.githubusercontent.com/AnomalyNTE/Anomaly/main/logo.png
          footer_timestamp: true
  discord-test:
    # Manual "Run workflow" check of the Discord webhook: rebuilds the notes of
    # the last released tag and posts them again. Nothing is published.
    if: github.event_name == 'workflow_dispatch' && inputs.announce == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Read release notes
        id: notes
        run: |
          if [ ! -s CHANGES.md ]; then
            echo '::error::git-cliff produced no release notes to send.'
            exit 1
          fi
          {
            echo 'body<<ANOMALY_NOTES_EOF'
            cat CHANGES.md
            echo 'ANOMALY_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Announce test release on Discord
        uses: SethCohen/github-releases-to-discord@v1.20
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: '[测试] Anomaly ${{ github.ref_name }}'
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: ${{ github.server_url }}/${{ github.repository }}/releases/latest
          content: '`Discord webhook 测试消息，可忽略`'
          color: '11052455'
          username: Anomaly
          avatar_url: https://raw.githubusercontent.com/AnomalyNTE/Anomaly/main/logo.png
          footer_title: Anomaly (测试)
          footer_icon_url: https://raw.githubusercontent.com/AnomalyNTE/Anomaly/main/logo.png
          footer_timestamp: true
