name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake --preset windows-vs2022
          -DBUILD_TESTING=OFF
          -DANOMALY_BUILD_PLUGIN_MANAGER_FIXTURE=OFF
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Package runtime, SDK, tools and symbols
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-sdk.zip
            .build/release/Anomaly-*-tools.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-sdk.zip
            .build/release/Anomaly-*-tools.zip
      - name: Publish runtime, SDK and tools
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-sdk.zip
            .build/release/Anomaly-*-tools.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
