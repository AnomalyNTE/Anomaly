name: windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake --preset windows-vs2022
          -DBUILD_TESTING=OFF
          -DANOMALY_BUILD_PLUGIN_MANAGER_FIXTURE=OFF
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Package runtime, SDK, tools and symbols
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Attest published archives
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-sdk.zip
            .build/release/Anomaly-*-tools.zip
      - name: Publish runtime, SDK and tools
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-sdk.zip
            .build/release/Anomaly-*-tools.zip
          fail_on_unmatched_files: true
