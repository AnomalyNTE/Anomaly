name: windows

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-debug
          - windows-relwithdebinfo
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-vs2022
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Install runtime package
        if: matrix.preset == 'windows-relwithdebinfo'
        run: >-
          cmake --install .build/windows-vs2022
          --config RelWithDebInfo
          --prefix .build/windows-vs2022/game-package
          --component GameRuntime
      - name: Package and audit release components
        if: matrix.preset == 'windows-relwithdebinfo'
        shell: pwsh
        run: >-
          ./tools/package_release.ps1
          -BuildDirectory .build/windows-vs2022
          -Version 1.0.0
          -Configuration RelWithDebInfo
          -OutputDirectory .build/pr-release
      - name: Upload package audit reports
        if: always() && matrix.preset == 'windows-relwithdebinfo'
        uses: actions/upload-artifact@v4
        with:
          name: pr-release-metadata
          path: |
            .build/pr-release/audit
            .build/pr-release/sbom
            .build/pr-release/SHA256SUMS.txt
            .build/pr-release/release-manifest.json
  address-sanitizer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure AddressSanitizer
        run: cmake --preset windows-asan
      - name: Build AddressSanitizer fixtures
        run: cmake --build --preset windows-asan --parallel
      - name: Run parser, startup and plugin runtime fixtures under AddressSanitizer
        run: >-
          ctest --preset windows-asan
          -R "input_fuzz_tests|startup_fault_matrix|plugin_runtime_v1_tests"
