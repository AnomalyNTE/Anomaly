name: windows

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake --preset windows-vs2022
          -DBUILD_TESTING=OFF
          -DANOMALY_BUILD_PLUGIN_MANAGER_FIXTURE=OFF
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Install runtime package
        run: >-
          cmake --install .build/windows-vs2022
          --config RelWithDebInfo
          --prefix .build/windows-vs2022/game-package
          --component GameRuntime
      - name: Package and audit release components
        shell: pwsh
        run: >-
          ./tools/package_release.ps1
          -BuildDirectory .build/windows-vs2022
          -Version 1.0.0
          -Configuration RelWithDebInfo
          -OutputDirectory .build/pr-release
      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-release-metadata
          path: |
            .build/pr-release/audit
            .build/pr-release/sbom
            .build/pr-release/SHA256SUMS.txt
            .build/pr-release/release-manifest.json
